<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Best Month</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header>
<h1>Best Month</h1>
<p>31 ideas. One every day.</p>
<div class="progress"><div id="bar"></div></div>
<div id="counter">0 / 31 opened</div>
</header>

<main id="grid" class="grid"></main>

<dialog id="modal">
<button id="close" class="icon">✕</button>
<div class="tag" id="dayTag"></div>
<h2 id="title"></h2>
<p id="text"></p>
<a id="link" class="button" target="_blank">Open link</a>
</dialog>
</div>
<script src="script.js"></script>
</body>
</html>
